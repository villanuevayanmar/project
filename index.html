<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayTrack | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <!-- LOGIN PAGE: the form opens the dashboard when both fields are filled in. -->
    <main class="login-page">
        <section class="login-card">
            <div class="brand-mark">PT</div>

            <p class="eyebrow">PAYROLL MANAGEMENT SYSTEM</p>
            <h1>PayTrack</h1>
            <p class="login-description">Manage employee payroll information in one place.</p>

            <form action="dashboard.html" method="get">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       placeholder="Enter your username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password" required>

                <button type="submit">Login</button>
            </form>

            <p class="login-note">Payroll system demonstration</p>
        </section>
    </main>

    <footer class="login-footer">
        PayTrack Payroll Management System
    </footer>

</body>
</html>
